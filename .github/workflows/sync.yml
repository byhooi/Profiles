name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # 每天北京时间早8点
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    runs-on: ubuntu-latest
    name: Sync latest commits from upstream repo

    steps:
    - name: Checkout target repo
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Sync Upstream
      uses: actions/github-script@v6
      with:
        script: |
          // 👇 1. 设置上游仓库地址
          const upstream_repo = "hywan9/Profiles";
          
          // 👇 2. 设置分支
          const branch = "main"; 

          try {
            // 修正：删除了报错的 require 语句
            // exec 工具是内置的，直接使用即可

            // 配置身份
            await exec.exec("git config --global user.name 'GitHub Actions'");
            await exec.exec("git config --global user.email 'actions@github.com'");

            // 添加上游并获取更新
            await exec.exec(`git remote add upstream https://github.com/${upstream_repo}.git`);
            await exec.exec("git fetch upstream");

            // 确保切换到 main 分支
            await exec.exec(`git checkout ${branch}`);

            // ⚡️ 霸道合并模式
            try {
              console.log("尝试合并上游代码...");
              // -X theirs: 遇到冲突时，无条件使用上游作者的版本
              // --allow-unrelated-histories: 允许合并历史不相关的仓库
              await exec.exec(`git merge upstream/${branch} -X theirs --allow-unrelated-histories --no-edit`);
            } catch (error) {
              console.error("合并依然失败，正在输出详细日志...");
              await exec.exec("git status");
              throw error;
            }

            // 推送
            await exec.exec("git push origin");
            console.log("✅ 同步成功！");
            
          } catch (error) {
            console.error("❌ 同步失败:", error);
            core.setFailed(error.message);
          }
